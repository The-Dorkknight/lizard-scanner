name: build
# Checks the app starts far enough to print its version, then runs every test
# (the window tests under a virtual display).
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: pip install numpy Pillow pytest
      - run: python lizard_scanner.py --version
      - run: xvfb-run -a python -m pytest tests/ -q
