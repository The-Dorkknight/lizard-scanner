name: Bug report
description: Something broke or looked wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This project is a work in progress. Reports from a real CR-Scan Lizard are very welcome.
  - type: input
    id: version
    attributes:
      label: App version (title bar)
      placeholder: "0.5.2-wip (Built ...)"
    validations: { required: true }
  - type: dropdown
    id: source
    attributes:
      label: Scanner
      options: [Real CR-Scan Lizard, Simulated scanner, Playing back a recording]
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Operating system
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Messages, bootstrap.log, or calibration_report.txt (blank out the serial if you like)
      render: text
